name: Build & Release SmartBudget APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: node ./node_modules/vite/bin/vite.js build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor to Android
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug / Auto-Signed)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK Asset
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/SmartBudget.apk
          echo "APK generated successfully at release-artifacts/SmartBudget.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartBudget-APK
          path: release-artifacts/SmartBudget.apk

      - name: Generate Release Tag & Changelog
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(node -p "require('./package.json').version || '1.6.0'")
            TAG_NAME="v${VERSION}.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "SmartBudget ${{ steps.vars.outputs.tag_name }}"
          body: |
            ### 🚀 SmartBudget Mise à Jour Automatique

            **Dernier changement :** ${{ steps.vars.outputs.commit_msg }}
            **Build :** `${{ github.sha }}`
            
            Cette version est prête à être installée sur votre smartphone Android.
            Votre application installée détectera automatiquement cette version et vous proposera de la télécharger !
          draft: false
          prerelease: false
          make_latest: true
          files: release-artifacts/SmartBudget.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

